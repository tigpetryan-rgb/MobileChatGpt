services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: mobile_chatgpt
      POSTGRES_USER: mobile_chatgpt
      POSTGRES_PASSWORD: mobile_chatgpt_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobile_chatgpt -d mobile_chatgpt"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - project_brain_pg:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://mobile_chatgpt:mobile_chatgpt_dev@db:5432/mobile_chatgpt
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  project_brain_pg:
